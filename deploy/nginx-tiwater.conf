# Copied to /etc/nginx/sites-available/tiwater by bootstrap-droplet.sh.
# Certbot rewrites this file on the server when certificates are issued.
# Staging hostname is live during the Azure parallel period.
# tiwater.mx and www are listed so the same site answers after the DNS flip.

server {
    listen 80;
    listen [::]:80;
    server_name staging.tiwater.mx tiwater.mx www.tiwater.mx;

    root /var/www/tiwater/dist;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
